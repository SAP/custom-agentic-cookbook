[project]
name = "production-order-agent"
version = "0.1.0"
description = "A mock-safe A2A production-order agent with SAP S/4HANA MCP tools"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "a2a-sdk[http-server]>=1.0.3,<2",
    "httpx>=0.28,<1",
    "mcp>=1.28,<2",
    "starlette>=1.1,<2",
    "uvicorn>=0.48,<1",
]

[project.optional-dependencies]
aicore = [
    "sap-ai-sdk-gen>=6.9,<7",
]

[dependency-groups]
dev = [
    "httpx2>=2.12,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/production_order_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
