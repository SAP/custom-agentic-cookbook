[project]
name = "fde-a2a-minimal"
version = "0.1.0"
description = "A minimal, credential-free A2A v1.0 server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.0.3,<2",
    "starlette>=1.1.0,<2",
    "uvicorn>=0.48.0,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0,<3",
    "pytest>=8.4,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
