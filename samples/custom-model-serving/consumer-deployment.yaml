# Replace every placeholder in an ignored copy before deployment review.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cookbook-custom-consumer
spec:
  replicas: 1
  selector:
    matchLabels: {app: cookbook-custom-consumer}
  template:
    metadata:
      labels: {app: cookbook-custom-consumer}
    spec:
      imagePullSecrets:
        - name: REPLACE_WITH_EXISTING_REGISTRY_SECRET
      containers:
        - name: agent
          image: REPLACE_WITH_REVIEWED_AGENT_IMAGE_DIGEST
          envFrom:
            - secretRef:
                name: REPLACE_WITH_EXISTING_CUSTOM_MODEL_SECRET
          env:
            - {name: LLM_PROVIDER, value: aicore-custom}
            - {name: MODEL_NAME, value: "qwen2.5:1.5b"}
            - {name: HOST, value: "0.0.0.0"}
            - {name: PORT, value: "8000"}
            - {name: URL, value: "http://cookbook-custom-consumer:8000"}
            - {name: MCP_SERVER_URL, value: "http://127.0.0.1:8090/sse"}
          ports:
            - {containerPort: 8000}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /.well-known/agent-card.json, port: 8000}
        - name: mcp
          image: REPLACE_WITH_REVIEWED_AGENT_IMAGE_DIGEST
          command: [python, -m, production_order_agent.mcp_server]
          env:
            - {name: DATA_MODE, value: mock}
            - {name: MCP_HOST, value: "127.0.0.1"}
            - {name: MCP_PORT, value: "8090"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: cookbook-custom-consumer
spec:
  type: ClusterIP
  selector: {app: cookbook-custom-consumer}
  ports:
    - {port: 8000, targetPort: 8000}
