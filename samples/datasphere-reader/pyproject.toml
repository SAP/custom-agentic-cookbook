[project]
name = "datasphere-reader"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["httpx>=0.28,<1", "mcp>=1.28,<2"]
[project.optional-dependencies]
a2a = ["a2a-sdk[http-server]>=1.0.3,<2", "starlette>=1.1,<2", "uvicorn>=0.48,<1"]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.14,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
